name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The exact floor (3.13.6, the oldest interpreter that has all three
        # html.parser fixes jimemo's checks rely on -- see
        # src/jimemo/__init__.py) plus what the
        # fleet actually runs. Pinned to the exact patch, not "3.13": a
        # floating 3.13 would silently stop testing the floor boundary the
        # moment setup-python's 3.13 moved, and 3.13.0-3.13.5 are below it.
        python-version: ["3.13.6", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q
      - run: ./jimemo doctor
