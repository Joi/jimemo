# gate.yml — the repo gate as a required check (kata jibot-code#q4av).
#
# INERT until this repo is in the organisation AND its .repoman-managed marker
# says `lane: pr-queue`. The lane guard is the first step of every job here for
# exactly that reason: a file in .github/workflows runs as soon as a runner
# exists, whether or not anybody meant it to, and triggers carry no lane
# condition.
#
# This is the UNTRUSTED half of the design. It runs code that arrived in a pull
# request, so it holds no secret, declares `contents: read`, and runs on a
# GitHub-hosted runner — a different machine from the bridge runner that holds
# KATA_AUTH_TOKEN. See docs/superpowers/specs/2026-09-21-q4av-pr-landing-path-design.md
# in cell-fleet, "Secrets and the two trust domains". jimemo is public, and the
# organisation's own gate machines take no public repository, so this gate
# runs on GitHub's (kata jibot-code#bden). A pull request from an outside
# contributor's fork runs it only after a maintainer approves the run.
#
# It triggers on `pull_request` AND `merge_group` because a required check has
# to report in both: the pull request must go green to be added to the queue,
# and the merge group must go green to leave it.
name: gate

on:
  pull_request:
  merge_group:

concurrency:
  # Keyed on the ref, not the repo: two different pull requests may gate in
  # parallel on hosted runners. What this prevents is a re-push piling a
  # second run on the same ref behind the first.
  group: gate-${{ github.repository }}-${{ github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    # Evaluated by GitHub BEFORE a runner is asked for. Under any other owner
    # (a fork, or the user account after a rollback) there is no lane and no
    # bridge to read the outcome, so the job must not run at all; the lane
    # guard cannot stand in for this, because it only runs once a runner has
    # started the job. Rollback to the user account therefore needs no edit here.
    if: github.repository_owner == 'ito-works'
    runs-on: ubuntu-latest
    # This gate takes about a minute against a 300 s registry budget
    # (measured 2026-09-22: 1712 tests in 51 s on a Mac). The job budget must
    # sit UNDER the queue's check_response_timeout_minutes (30), or a run that
    # is still working correctly is evicted while the job is still allowed to
    # continue — the two numbers are one decision, not two. 14 here (an
    # 11-minute gate step and the steps around it, including setting up Python;
    # no warm — this gate has no dependency store).
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # No token in .git/config: the gate reads the working tree, never the
          # remote, and a credential left here is readable by every test.
          persist-credentials: false
          # A workspace carrying a cache from the previous job counts as dirty
          # to the gate's pristineness probe, which silently costs the full
          # battery (cell-fleet test-gate.sh:1646-1658).
          clean: true
          # Gives us refs/remotes/origin/* without a second fetch.
          fetch-depth: 0

      - id: lane
        env:
          # The BASE ref is the lane authority, never the checked-out tree: on
          # a pull_request event the checkout is the candidate's, and a marker
          # it wrote is not the repository's landing authority. The object is
          # already present from fetch-depth: 0, so this needs no credential.
          LANE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: ci/lane-guard.sh

      - name: python at jimemo's floor series
        if: steps.lane.outputs.active == 'true'
        # The runner image's own python3 is below jimemo's 3.13.6 floor and has
        # no pytest. setup-python puts its interpreter first on PATH; 3.13
        # resolves to the newest 3.13 release, above the floor, and
        # ci/gate-ready.sh refuses anything that is not.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: install the gate's one dependency
        if: steps.lane.outputs.active == 'true'
        # One version, the one ci.yml pins. It lands in setup-python's
        # interpreter, not under HOME, so the scratch HOME the gate wrapper
        # synthesises does not hide it.
        run: python -m pip install pytest==8.4.2

      - name: pin the base ref
        if: steps.lane.outputs.active == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # The gate reads refs/remotes/origin/main for change scoping
          # (cell-fleet test-gate.sh:1702) and gated suites read it directly.
          # repoman recreates it by hand in its isolated checkout (cell-fleet
          # gitops.py:407-411); here the objects are already present from
          # fetch-depth: 0, so this is a local ref write and NOT a fetch — a
          # fetch would have no credential after persist-credentials: false,
          # which is the point of that flag.
          git update-ref "refs/remotes/origin/${GITHUB_BASE_REF:-main}" "$BASE_SHA"

      - name: gate
        id: gate
        if: steps.lane.outputs.active == 'true'
        # Two attempts at the registry row's 300 s each (run-gate.sh permits
        # one defer retry and has no per-attempt supervisor), plus a minute.
        timeout-minutes: 11
        env:
          # The wrapper's own python3 probe only asks whether an interpreter
          # starts. ci/gate-ready.sh asks the real question — a final release
          # at or above the floor, with pytest importable — so a Python setup
          # that went wrong defers instead of bouncing the producer. No
          # per-host lock: a hosted runner runs one job.
          RUN_GATE_PREFLIGHT: python3 ci/gate-ready.sh
          GATE_OUTCOME_FILE: ${{ runner.temp }}/gate-outcome
          # The head the bridge must compare against the head NOW, to tell a
          # current verdict from one the world has moved past. The submission
          # attempt is NOT passed here: it lives in the pull request body, which
          # the bridge parses anyway, and reading it from a workflow expression
          # would mean trusting a field the gate never validated.
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        # The registry row's command, verbatim (cell-fleet
        # ops/repoman/registry/repos.tsv, jimemo). run-gate.sh passes the
        # job's PATH, with setup-python's interpreter first, through its
        # `env -i`.
        run: |
          ci/run-gate.sh "${{ runner.temp }}/gate-scratch" \
            "python3 -m pytest tests -q"

      - name: publish the outcome
        # always(): the outcome matters MOST when the gate step failed, and
        # `deferred` in particular must reach the bridge. Without this
        # condition the artifact is never uploaded on exactly the outcomes the
        # bridge has to distinguish.
        if: always() && steps.lane.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-outcome
          path: ${{ runner.temp }}/gate-outcome
          if-no-files-found: ignore
          retention-days: 7
